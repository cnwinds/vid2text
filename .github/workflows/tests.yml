name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(funasr-onnx|modelscope|jieba|numpy)' requirements.txt \
            | grep -v '^#' \
            | grep -v '^[[:space:]]*$' \
            > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install uvicorn
          playwright install chromium

      - name: Run tests
        env:
          VID2TEXT_SKIP_ADMIN_CHECK: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
