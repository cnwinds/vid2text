services:
  vid2text:
    build: .
    container_name: vid2text
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # 应用代码挂载：改代码后 docker compose restart 即可，无需 rebuild
      - ./douyin_to_text:/app/douyin_to_text:ro
      - ./web:/app/web:ro
      - ./tests:/app/tests:ro
      - ./run_web.py:/app/run_web.py:ro
    env_file:
      - .env
    environment:
      - SENSEVOICE_OFFLINE=1
      - SENSEVOICE_MODEL_DIR=/app/models/SenseVoiceSmall-onnx
      - WORK_CACHE_QUOTA_GB=2
      # 宿主机 Clash HTTP 代理（YouTube 等）；国内站点走 NO_PROXY 直连
      - HTTP_PROXY=${HTTP_PROXY:-http://host.docker.internal:7890}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://host.docker.internal:7890}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,douyin.com,iesdouyin.com,bilibili.com,b23.tv,modelscope.cn,aliyuncs.com}
      - http_proxy=${HTTP_PROXY:-http://host.docker.internal:7890}
      - https_proxy=${HTTPS_PROXY:-http://host.docker.internal:7890}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal,douyin.com,iesdouyin.com,bilibili.com,b23.tv,modelscope.cn,aliyuncs.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    mem_swappiness: 60
    command:
      - python
      - -m
      - uvicorn
      - web.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
