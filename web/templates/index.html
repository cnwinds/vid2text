<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vid2text — 视频转文字</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>vid2text</h1>
      <p class="subtitle">支持抖音 / B站 / YouTube 等，优先平台字幕，无字幕则 STT</p>
    </header>

    <section class="card">
      <form id="submit-form">
        <label for="url-input">视频链接</label>
        <div class="input-row">
          <input
            id="url-input"
            type="url"
            placeholder="粘贴视频 URL，例如 https://www.youtube.com/watch?v=..."
            required
          />
          <button type="submit" id="submit-btn">提交</button>
        </div>
      </form>
      <p id="status-msg" class="status-msg" hidden></p>
    </section>

    <section id="result-section" class="card" hidden>
      <h2>结果</h2>
      <div class="meta">
        <span id="result-platform"></span>
        <span id="result-status" class="badge"></span>
      </div>
      <h3 id="result-title"></h3>

      <div class="field">
        <h4>视频描述</h4>
        <pre id="result-description"></pre>
      </div>
      <div class="field">
        <h4>原始转录</h4>
        <pre id="result-raw"></pre>
      </div>
      <div class="field">
        <h4>修正后文本</h4>
        <pre id="result-corrected"></pre>
      </div>
      <p id="result-error" class="error" hidden></p>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>历史记录</h2>
        <button type="button" id="refresh-history" class="ghost">刷新</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
