<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vid2text — 视频转字幕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span>LOCAL EXTRACTION</div>
      <div class="title-row">
        <h1>vid2text</h1>
        <div class="wave-hero" id="heroWave" aria-hidden="true"></div>
      </div>
      <p class="sub">粘贴视频链接，提取口播 / 字幕文本</p>
      {% include "_site_nav.html" %}
    </header>

    <section class="panel">
      <form id="submit-form">
        <label class="field-label" for="url-input">视频链接</label>
        <div class="input-row">
          <input
            id="url-input"
            type="url"
            name="url"
            placeholder="https://www.douyin.com/video/… 或 bilibili / YouTube"
            autocomplete="off"
            required
          />
          <button type="submit" class="submit-btn" id="submit-btn">提交</button>
        </div>
      </form>
      <p id="status-msg" class="status-msg" hidden></p>
    </section>

    <div id="task-modal" class="m-modal" hidden aria-hidden="true">
      <div class="m-modal-backdrop" data-modal-close></div>
      <div class="m-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <header class="m-modal-head">
          <h2 id="task-modal-title" class="m-modal-title">任务详情</h2>
          <button type="button" class="m-modal-close" data-modal-close aria-label="关闭">&times;</button>
        </header>
        <div class="m-modal-body" id="task-modal-body"></div>
        <div class="m-modal-foot" id="task-modal-foot" hidden></div>
      </div>
    </div>

    <section class="panel m-list-panel">
      <div class="m-list-toolbar">
        <div>
          <h2 class="m-section-title">历史记录</h2>
          <p class="m-section-desc">仅展示最近 20 条 · 点击卡片查看文稿 · 右侧图标可复制或下载</p>
        </div>
        <button type="button" class="m-btn m-btn-ghost" id="refresh-history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.36M21 3v6h-6"/></svg>
          刷新
        </button>
      </div>
      <div id="history-list" class="m-list"></div>
    </section>

    <footer>VID2TEXT — LOCAL EXTRACTION ENGINE</footer>
  </div>
  <script src="/static/ui-shared.js?v={{ static_v() }}"></script>
  <script src="/static/proc-effect.js?v={{ static_v() }}"></script>
  <script src="/static/app.js?v={{ static_v() }}"></script>
</body>
</html>
