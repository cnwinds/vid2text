<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vid2text — 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page">
  <canvas id="bgCanvas" aria-hidden="true"></canvas>
  <div class="wrap">
    <header class="subpage-header">
      <p class="back-link"><a href="/">← 返回主页</a></p>
      <div class="eyebrow"><span class="dot"></span>ADMIN</div>
      <h1 class="subpage-title">登录</h1>
      <p class="sub">访问监控与设置需验证管理密码</p>
    </header>

    <section class="panel login-panel">
      {% if error %}
      <p class="login-error" role="alert">密码错误，请重试</p>
      {% endif %}
      {% if not configured %}
      <p class="login-error" role="alert">服务未配置 ADMIN_PASSWORD，请在 .env 中设置后重启</p>
      {% else %}
      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next" value="{{ next_path }}" />
        <label class="field-label" for="password">管理密码</label>
        <input
          id="password"
          type="password"
          name="password"
          class="login-input"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="submit" class="submit-btn login-submit">登录</button>
      </form>
      {% endif %}
    </section>

    <footer>VID2TEXT — ADMIN</footer>
  </div>
  <script>
    (function initBg() {
      const canvas = document.getElementById("bgCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);
      const pts = Array.from({ length: 40 }, () => ({
        x: Math.random(), y: Math.random(), r: 0.8 + Math.random(), ph: Math.random() * 6.28,
      }));
      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const p of pts) {
          p.ph += 0.02;
          ctx.beginPath();
          ctx.fillStyle = `rgba(70,224,201,${0.08 + 0.06 * Math.sin(p.ph)})`;
          ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
